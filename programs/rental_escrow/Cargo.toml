[package]
name = "rental-escrow"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "rental_escrow"

[features]
default = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
# Default binaries reject all initialization. This explicit feature is only for local/devnet proof.
test-deployment = []

[dependencies]
anchor-lang = "=0.32.1"
anchor-spl = { version = "=0.32.1", default-features = false, features = ["token", "token_2022"] }
klend-interface = { git = "https://github.com/Kamino-Finance/klend", rev = "a08760976f51a3a58c4a0c6ea27b4a0e565bca79" }
uint = { version = "=0.10.0", default-features = false }

[dev-dependencies]
bytemuck = "1"
litesvm = "=0.7.1"
solana-account = "2.2"
solana-keypair = "2.2"
solana-message = "2.3"
solana-signer = "2.2"
solana-transaction = "2.2"
base64 = "0.22"
bincode = "1"
serde_json = "1"
